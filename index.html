<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univerzální Testovací Nástroj</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="3d432c86-878c-49e4-ad89-33967368d2c5"></script>
</head>
<body>

    <button id="theme-toggle-btn" title="Přepnout tmavý/světlý režim">🌗</button>

    <div class="container">
        <div id="menu-box">
            <h1>Nastavení testu</h1>
            
            <select id="subject-select" onchange="updateMaxQuestions()">
                <option value="" disabled selected>-- 1. Vyber předmět --</option>
                </select>

            <div class="settings-group">
                <div class="settings-row vertical">
                    <label for="set-count">Počet otázek:</label>
                    <div class="slider-container">
                        <input type="range" id="q-slider" min="1" value="10" oninput="syncInputs(this.value)">
                        <input type="number" id="set-count" min="1" value="10" oninput="syncInputs(this.value)">
                        <span class="max-info">/ <span id="max-q-label">0</span></span>
                    </div>
                </div>
                <div class="settings-row">
                    <label for="set-random">Náhodné pořadí otázek:</label>
                    <input type="checkbox" id="set-random" checked>
                </div>
                <div class="settings-row">
                    <label for="set-testmode" title="Nevidíš správné odpovědi hned, až na konci.">Režim 'Test' (výsledky až na konci):</label>
                    <input type="checkbox" id="set-testmode">
                </div>
            </div>

            <button class="btn" onclick="startQuiz()">Spustit test</button>
            <button id="practice-errors-btn" class="btn btn-green-outline" onclick="startQuiz(true)" disabled>Žádné chyby k procvičování</button>
            
            <div id="preview-controls" class="hidden">
                <button class="btn btn-secondary" onclick="showAllQuestions()">Zobrazit všechny otázky a odpovědi</button>
            </div>
        </div>

        <div id="quiz-interface" class="hidden">
            <div class="quiz-header-row">
                <button class="btn-back" onclick="quitQuiz()">← Ukončit test</button>
                <button id="nav-toggle-btn" class="btn-back hidden" onclick="toggleNavigator()">Mapa otázek</button>
            </div>
            <h3 id="quiz-title">Předmět</h3>
            <div class="score-board">Otázka <span id="current-q">1</span> z <span id="total-q">0</span></div>
            <div id="question-navigator" class="hidden"></div>
            <div id="progress-bar-container"></div>
            
            <div id="quiz-box">
                <div class="question-text" id="question">Text otázky...</div>
                <ul class="options-list" id="options"></ul>
                
                <div class="feedback" id="feedback"></div>
                
                <button class="btn" id="action-btn" onclick="handleAction()">Potvrdit</button>
            </div>
        </div>

        <div id="result-box" class="hidden">
            <h2>Test dokončen!</h2>
            <p class="score-text">Skóre: <strong id="final-score"></strong></p>
            <p id="percentage-score"></p>
            
            <div id="detailed-report" class="error-report hidden"></div>

            <button class="btn" onclick="resetToMenu()">Zpět na nastavení</button>
        </div>

        <div id="all-questions-view" class="hidden">
            <button id="review-back-btn" class="btn-back" onclick="closeAllQuestions()">&#10094;</button>
            <h2 id="review-subject-title">Přehled otázek</h2>
            <div id="questions-list-container"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="kvizovac.js"></script>

</body>
</html>
